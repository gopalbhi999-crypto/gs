name: Build Gopal apk

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "AppForge build ID"
        required: true
        type: string

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Android
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"


      - name: Download build configuration
        env:
          BUILD_SERVER_URL: ${{ secrets.BUILD_SERVER_URL }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          curl -fL \
            "$BUILD_SERVER_URL/api/build-config/$BUILD_ID" \
            -o build-config.json

          cat build-config.json


      - name: Prepare Android project
        env:
          BUILD_SERVER_URL: ${{ secrets.BUILD_SERVER_URL }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |

          node <<'NODE'

          const fs = require("fs");

          const config =
            JSON.parse(
              fs.readFileSync(
                "build-config.json",
                "utf8"
              )
            );

          const file =
            "android-template/app/build.gradle";

          let gradle =
            fs.readFileSync(
              file,
              "utf8"
            );

          gradle =
            gradle.replace(
              "__PACKAGE_NAME__",
              config.packageName
            );

          fs.writeFileSync(
            file,
            gradle
          );


          const activity =
            "android-template/app/src/main/java/com/appforge/template/MainActivity.java";

          let java =
            fs.readFileSync(
              activity,
              "utf8"
            );

          java =
            java.replace(
              "__WEBSITE_URL__",
              config.website
            );

          fs.writeFileSync(
            activity,
            java
          );


          const manifest =
            "android-template/app/src/main/AndroidManifest.xml";

          let xml =
            fs.readFileSync(
              manifest,
              "utf8"
            );

          xml =
            xml.replace(
              "__APP_NAME__",
              config.appName
            );

          fs.writeFileSync(
            manifest,
            xml
          );

          NODE


      - name: Build APK
        working-directory: android-template
        run: |
          gradle assembleRelease


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: appforge-apk-${{ inputs.build_id }}
          path: android-template/app/build/outputs/apk/release/*.apk
          retention-days: 7
