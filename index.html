<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCall Pro - Instant Video Conferencing</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Jitsi External API Script -->
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent), radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.15), transparent), #0b0f19;
            min-height: 100vh;
            color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gradient-btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
        }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 md:p-8 min-h-screen">

    <!-- Header -->
    <header class="w-full max-w-6xl flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-video text-white text-lg"></i>
            </div>
            <span class="text-2xl font-bold tracking-tight text-white">Nex<span class="gradient-text">Call Pro</span></span>
        </div>
        <div class="flex items-center gap-2 text-xs md:text-sm bg-gray-900/60 border border-gray-800 px-4 py-2 rounded-full font-semibold tracking-wider text-indigo-400">
            <span class="h-2 w-2 rounded-full bg-indigo-500 animate-pulse"></span> GOPAL
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md my-auto flex flex-col items-center justify-center">
        
        <!-- Welcome & Join/Host Form Dashboard -->
        <div id="setup-panel" class="w-full glass-panel p-8 rounded-3xl shadow-2xl relative overflow-hidden transition-all duration-500">
            <!-- Floating Decorative Blob -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500/15 rounded-full blur-2xl"></div>
            
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold tracking-tight text-white mb-2">Brave-Style Call</h2>
                <p class="text-gray-400 text-sm">Enter a room code to host or join instantly</p>
            </div>

            <!-- Error Box -->
            <div id="error-box" class="hidden mb-5 bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-xl text-sm">
                <span id="error-text">Please enter valid details.</span>
            </div>

            <!-- Single Uniform Form (Brave Style) -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Your Name</label>
                    <input type="text" id="user-name" placeholder="Enter your name" class="w-full px-4 py-3 bg-gray-900/50 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Meeting Code (1 - 50000)</label>
                    <div class="flex gap-2">
                        <input type="number" id="room-code" min="1" max="50000" placeholder="Enter code to Host or Join" class="w-full px-4 py-3 bg-gray-900/50 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-indigo-500 text-sm">
                        <button id="gen-code-btn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 rounded-xl border border-gray-700 text-xs transition-colors cursor-pointer">Auto</button>
                    </div>
                </div>
                
                <button id="launch-btn" class="w-full gradient-btn text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 text-sm cursor-pointer mt-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Connect to Meeting
                </button>
            </div>
        </div>

        <!-- Video Wrapper Container -->
        <div id="video-wrapper" class="hidden w-full max-w-5xl flex flex-col gap-3 fixed inset-0 z-50 p-4 bg-[#0b0f19]">
            <div class="w-full flex justify-between items-center bg-gray-900/80 border border-gray-800 px-4 py-2.5 rounded-xl text-xs md:text-sm">
                <span class="text-gray-400"><i class="fa-solid fa-hashtag text-indigo-400 mr-1.5"></i>Secure Code: <strong id="active-code-lbl" class="text-white"></strong></span>
                <button id="leave-btn" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 px-3 py-1 rounded-lg text-xs font-semibold transition-colors cursor-pointer">
                    <i class="fa-solid fa-phone-slash mr-1"></i> Exit Call
                </button>
            </div>
            <div id="jitsi-container" class="w-full flex-1 glass-panel rounded-3xl overflow-hidden shadow-2xl relative"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-6xl text-center text-xs text-gray-500 mt-6">
        Powered by Jitsi WebRTC &bull; Secure Encrypted Communication Active
    </footer>

    <!-- logic javascript -->
    <script>
        const setupPanel = document.getElementById('setup-panel');
        const videoWrapper = document.getElementById('video-wrapper');
        const jitsiContainer = document.getElementById('jitsi-container');
        const activeCodeLbl = document.getElementById('active-code-lbl');
        const errorBox = document.getElementById('error-box');
        const errorText = document.getElementById('error-text');
        
        let api = null;

        // Auto Generate Code Helper (1 to 50000)
        document.getElementById('gen-code-btn').addEventListener('click', () => {
            const randomCode = Math.floor(Math.random() * 50000) + 1;
            document.getElementById('room-code').value = randomCode;
        });

        // Main Function to Connect to Call
        document.getElementById('launch-btn').addEventListener('click', () => {
            const name = document.getElementById('user-name').value.trim();
            const code = parseInt(document.getElementById('room-code').value);

            if(!name) { 
                showError('Please enter your name.'); 
                return; 
            }
            if(!code || code < 1 || code > 50000) { 
                showError('Please enter a valid code between 1 and 50000.'); 
                return; 
            }

            errorBox.classList.add('hidden');
            setupPanel.classList.add('hidden');
            videoWrapper.classList.remove('hidden');
            jitsiContainer.innerHTML = '';
            
            activeCodeLbl.textContent = code;

            // Jitsi Open Server Domain (No Authentication Required / Brave Style)
            const domain = 'meet.jit.si';
            
            // à¤à¥à¤¡ à¤à¥ à¤¬à¥à¤à¤à¥à¤°à¤¾à¤à¤à¤¡ à¤®à¥à¤ à¤à¤ à¤¸à¤¿à¤à¥à¤¯à¥à¤° à¤¯à¥à¤¨à¤¿à¤ à¤¯à¥à¤à¤°à¤à¤² à¤à¤¡à¥à¤°à¥à¤¸ / à¤°à¥à¤® à¤à¤à¤¡à¥ à¤®à¥à¤ à¤¬à¤¦à¤²à¤¾ à¤à¤¯à¤¾ à¤¹à¥
            // à¤¤à¤¾à¤à¤¿ à¤²à¤¿à¤à¤ à¤¶à¥à¤¯à¤°à¤¿à¤à¤ à¤à¥ à¤à¥à¤ à¤à¤°à¥à¤°à¤¤ à¤¨ à¤ªà¤¡à¤¼à¥, à¤à¥à¤µà¤² à¤à¤¸ à¤à¥à¤¡ à¤¸à¤à¤à¥à¤¯à¤¾ à¤¸à¥ à¤¹à¥ à¤²à¥à¤ à¤à¤ªà¤¸ à¤®à¥à¤ à¤à¤¨à¥à¤à¥à¤ à¤¹à¥à¤à¤à¥à¥¤
            const uniqueRoomId = `nexcall_gopal_brave_sync_room_${code}`;

            const options = {
                roomName: uniqueRoomId,
                width: '100%',
                height: '100%',
                parentNode: jitsiContainer,
                userInfo: {
                    displayName: name
                },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    prejoinPageEnabled: false, // Brave à¤à¥ à¤¤à¤°à¤¹ à¤¸à¥à¤§à¤¾ à¤¡à¤¾à¤¯à¤°à¥à¤à¥à¤ à¤à¤à¤à¥à¤°à¥
                    requireDisplayName: true,
                    // à¤ªà¤¹à¤²à¤¾ à¤µà¥à¤¯à¤à¥à¤¤à¤¿ à¤à¤à¥-à¤®à¥à¤¡à¤°à¥à¤à¤° (Host) à¤¬à¤¨ à¤à¤¾à¤¤à¤¾ à¤¹à¥
                    apiEveryoneModerator: true 
                },
                interfaceConfigOverwrite: {
                    SHOW_JITSI_WATERMARK: false,
                    BRAND_WATERMARK_LINK: '',
                    // à¤à¤¨à¤µà¤¾à¤à¤ à¤à¤° à¤²à¤¿à¤à¤ à¤¶à¥à¤¯à¤°à¤¿à¤à¤ à¤¬à¤à¤¨ à¤¹à¤à¤¾ à¤¦à¤¿à¤ à¤à¤ à¤¹à¥à¤ à¤¤à¤¾à¤à¤¿ à¤à¥à¤ à¤¯à¥à¤à¤°à¤à¤² à¤¶à¥à¤¯à¤° à¤¨ à¤à¤° à¤¸à¤à¥
                    TOOLBAR_BUTTONS: [
                        'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
                        'fodeviceselection', 'hangup', 'profile', 'chat', 'settings', 'raisehand',
                        'videoquality', 'filmstrip', 'tileview', 'security', 'mute-everyone', 'mute-video-everyone'
                    ]
                }
            };

            api = new JitsiMeetExternalAPI(domain, options);

            // à¤à¥à¤² à¤à¤ à¤¯à¤¾ à¤¬à¤à¤¦ à¤¹à¥à¤¨à¥ à¤ªà¤° à¤°à¥à¤® à¤à¤° à¤à¥à¤¡ à¤à¥ à¤«à¥à¤°à¥ (Unreserved) à¤à¤°à¤¨à¥ à¤à¥ à¤²à¤¿à¤ à¤°à¥à¤¸à¥à¤ à¤²à¥à¤à¤¿à¤
            api.addEventListener('readyToClose', () => {
                resetInterface();
            });
        });

        // à¤à¤¸à¥à¤à¤® à¤²à¥à¤µ à¤¬à¤à¤¨ à¤à¥à¤°à¤¿à¤à¤°
        document.getElementById('leave-btn').addEventListener('click', () => {
            resetInterface();
        });

        function showError(message) {
            errorBox.classList.remove('hidden');
            errorText.textContent = message;
        }

        function resetInterface() {
            if(api) {
                api.dispose();
                api = null;
            }
            videoWrapper.classList.add('hidden');
            setupPanel.classList.remove('hidden');
            jitsiContainer.innerHTML = '';
            document.getElementById('room-code').value = '';
        }
    </script>
</body>
</html>
