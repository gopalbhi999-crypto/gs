<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title GOPAL Talk Video Call</title>
    <style>
        /* Pura page cover karne ke liye styling */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Brave Talk ko load karne ke liye iframe -->
    <!-- allow attribute camera aur microphone permissions ke liye zaroori hai -->
    <iframe 
        src="https://talk.brave.com" 
        allow="camera; microphone; display-capture; fullscreen">
    </iframe>

</body>
</html>
