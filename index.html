<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI App Generator - Build Apps Instantly</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-wand-magic-sparkles text-indigo-500 text-2xl"></i>
                <span class="text-xl font-bold tracking-tight">AI<span class="text-indigo-500">AppBuilder</span></span>
            </div>
            <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-medium">GitHub Pages Ready</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Left Column: Prompt Section -->
        <div class="flex flex-col space-y-4 bg-slate-900/40 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-2xl font-bold mb-1">Aapko kaisa App chahiye?</h1>
                <p class="text-slate-400 text-sm">Apne app ka idea detail mein yahan likhein, AI uske mutabiq code taiyar karega.</p>
            </div>

            <div class="flex flex-col space-y-2 flex-grow">
                <label for="appPrompt" class="text-sm font-medium text-slate-300">App Description / Prompt:</label>
                <textarea id="appPrompt" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-100 focus:outline-none focus:border-indigo-500 transition resize-none placeholder:text-slate-600" placeholder="Jaise: Ek To-Do list app banao jisme dark mode ho aur tasks local storage mein save ho sakein..."></textarea>
            </div>

            <button onclick="generateApp()" id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/20 cursor-pointer">
                <i class="fa-solid fa-bolt"></i>
                <span>Generate App</span>
            </button>
        </div>

        <!-- Right Column: Preview & Code Output Section -->
        <div class="flex flex-col bg-slate-900/40 border border-slate-800 rounded-2xl shadow-xl overflow-hidden">
            <!-- Tabs -->
            <div class="flex border-b border-slate-800 bg-slate-900/80">
                <button onclick="switchTab('preview')" id="tabPreview" class="flex-1 py-3 text-sm font-medium border-b-2 border-indigo-500 text-indigo-400 transition">Live Preview</button>
                <button onclick="switchTab('code')" id="tabCode" class="flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">Source Code</button>
            </div>

            <!-- Tab Contents -->
            <div class="flex-grow relative bg-slate-950 flex items-center justify-center p-4 min-h-[350px]">
                <!-- Preview Screen -->
                <div id="previewContent" class="w-full h-full flex items-center justify-center">
                    <div class="text-center text-slate-600 space-y-2">
                        <i class="fa-solid fa-code text-4xl mb-2"></i>
                        <p class="text-sm">App generate hone ke baad preview yahan dikhega.</p>
                    </div>
                </div>

                <!-- Code Screen -->
                <div id="codeContent" class="w-full h-full hidden overflow-auto">
                    <pre class="text-xs text-indigo-300 p-4 font-mono"><code id="codeOutput">&lt;!-- Code will appear here --&gt;</code></pre>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Powered by HTML, Tailwind & AI Logic. Host free on GitHub Pages.
    </footer>

    <!-- JavaScript for Functionality -->
    <script>
        function switchTab(tab) {
            const previewContent = document.getElementById('previewContent');
            const codeContent = document.getElementById('codeContent');
            const tabPreview = document.getElementById('tabPreview');
            const tabCode = document.getElementById('tabCode');

            if (tab === 'preview') {
                previewContent.classList.remove('hidden');
                codeContent.classList.add('hidden');
                tabPreview.classList.add('border-indigo-500', 'text-indigo-400');
                tabPreview.classList.remove('border-transparent', 'text-slate-400');
                tabCode.classList.remove('border-indigo-500', 'text-indigo-400');
                tabCode.classList.add('border-transparent', 'text-slate-400');
            } else {
                codeContent.classList.remove('hidden');
                previewContent.classList.add('hidden');
                tabCode.classList.add('border-indigo-500', 'text-indigo-400');
                tabCode.classList.remove('border-transparent', 'text-slate-400');
                tabPreview.classList.remove('border-indigo-500', 'text-indigo-400');
                tabPreview.classList.add('border-transparent', 'text-slate-400');
            }
        }

        function generateApp() {
            const promptText = document.getElementById('appPrompt').value.trim();
            const previewContainer = document.getElementById('previewContent');
            const codeOutput = document.getElementById('codeOutput');

            if (!promptText) {
                alert('Pehle apna app idea type karein!');
                return;
            }

            // Loading state
            document.getElementById('generateBtn').innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i><span>Generating...</span>`;

            setTimeout(() => {
                // Dummy generated app structure based on prompt (Aap isme OpenAI/Gemini API integrate kar sakte hain)
                const generatedHTML = `
<div class="p-6 bg-white text-slate-900 rounded-xl shadow-lg max-w-sm mx-auto my-auto w-full">
    <h2 class="text-xl font-bold mb-2 text-indigo-600">Generated App</h2>
    <p class="text-sm text-slate-600 mb-4">Idea: ${promptText}</p>
    <input type="text" placeholder="Type something..." class="w-full border p-2 rounded mb-3 text-sm">
    <button onclick="alert('Button clicked!')" class="w-full bg-indigo-600 text-white py-2 rounded font-medium text-sm">Click Me</button>
</div>`;

                previewContainer.innerHTML = generatedHTML;
                codeOutput.textContent = generatedHTML;

                // Reset button
                document.getElementById('generateBtn').innerHTML = `<i class="fa-solid fa-bolt"></i><span>Generate App</span>`;
            }, 1200);
        }
    </script>
</body>
</html>
