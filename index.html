<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCall - Premium Instant Video Calling</title>
    <!-- Tailwind CSS CDN for Premium UI styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Jitsi External API Script -->
    <script src="https://jit.si"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent), radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.15), transparent), #0b0f19;
            min-height: 100vh;
            color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .gradient-btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
        }
        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 md:p-8">
    <!-- Header / Brand -->
    <header class="w-full max-w-6xl flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
            <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-video text-white text-lg"></i>
            </div>
            <span class="text-2xl font-bold tracking-tight text-white">Nex<span class="gradient-text">Call</span></span>
        </div>
        <!-- GitHub की जगह GOPAL अपडेट किया गया -->
        <div class="flex items-center gap-2 text-xs md:text-sm bg-gray-900/60 border border-gray-800 px-4 py-2 rounded-full font-semibold tracking-wider text-indigo-400">
            <span class="h-2 w-2 rounded-full bg-indigo-500 animate-pulse"></span> GOPAL
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="w-full max-w-4xl my-auto flex flex-col items-center justify-center">
        <!-- Input Panel Container -->
        <div id="setup-panel" class="w-full max-w-md glass-panel p-8 rounded-3xl shadow-2xl relative overflow-hidden transition-all duration-500">
            <!-- Floating Decorative Blob -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500/15 rounded-full blur-2xl"></div>
            
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold tracking-tight text-white mb-2">Welcome Screen</h2>
                <p class="text-gray-400 text-sm">Instant, secure & encrypted audio/video calling</p>
            </div>

            <!-- Error Notification Alert Box -->
            <div id="error-box" class="hidden mb-5 bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-xl text-sm">
                <span id="error-text">Please enter a valid room name.</span>
            </div>

            <!-- Room Input Form -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Room Name</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500">
                            <i class="fa-solid fa-hashtag"></i>
                        </span>
                        <input type="text" id="room-input" placeholder="e.g. nexcall-team-sync" class="w-full pl-11 pr-4 py-3.5 bg-gray-900/50 border border-gray-800 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-sm">
                    </div>
                </div>
                <button id="start-call-btn" class="w-full gradient-btn text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 text-sm cursor-pointer">
                    <i class="fa-solid fa-video"></i> Start Instant Call
                </button>
            </div>
        </div>

        <!-- Video Container (Hidden Initially) -->
        <div id="jitsi-container" class="hidden w-full h-[600px] glass-panel rounded-3xl overflow-hidden shadow-2xl relative"></div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-6xl text-center text-xs text-gray-500 mt-8">
        Powered by Jitsi Meet &bull; Secure Peer-to-Peer Communication
    </footer>

    <!-- Script to handle Jitsi functionality -->
    <script>
        const startBtn = document.getElementById('start-call-btn');
        const roomInput = document.getElementById('room-input');
        const setupPanel = document.getElementById('setup-panel');
        const errorBox = document.getElementById('error-box');
        const errorText = document.getElementById('error-text');
        const jitsiContainer = document.getElementById('jitsi-container');

        let api = null;

        startBtn.addEventListener('click', () => {
            const roomName = roomInput.value.trim();
            if (!roomName) {
                errorBox.classList.remove('hidden');
                errorText.textContent = 'Please enter a valid room name to start.';
                return;
            }
            errorBox.classList.add('hidden');
            
            // इनपुट पैनल छुपाएं और वीडियो स्क्रीन खोलें
            setupPanel.classList.add('hidden');
            jitsiContainer.innerHTML = '';
            jitsiContainer.classList.remove('hidden');

            const domain = 'meet.jit.si';
            const options = {
                roomName: roomName,
                width: '100%',
                height: '100%',
                parentNode: jitsiContainer,
                interfaceConfigOverwrite: {
                    SHOW_JITSI_WATERMARK: false,
                    BRAND_WATERMARK_LINK: '',
                }
            };
            
            // कॉल डायरेक्ट स्टार्ट
            api = new JitsiMeetExternalAPI(domain, options);

            // जब होस्ट या यूजर लाल बटन (Hangup) दबाकर कॉल कट करे
            api.addEventListener('readyToClose', () => {
                api.dispose(); // जेआरपीसी इंस्टेंस और कोड रिसोर्स को पूरी तरह डिलीट (Free) करें
                jitsiContainer.classList.add('hidden'); // वीडियो बॉक्स छुपाएं
                jitsiContainer.innerHTML = ''; // पुराना कोड पूरा साफ करें
                setupPanel.classList.remove('hidden'); // वापस होम स्क्रीन लाएं
                roomInput.value = ''; // इनपुट फील्ड रीसेट करें
            });
        });
    </script>
</body>
</html>
